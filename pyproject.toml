[project]
name = "coenergy"
version = "0.1.0"
description = "Assessment coEnergy : prédiction d'indicateurs de performance énergétique (HLC, Hb, CDT) par deep learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "jupyter>=1.0", "ipykernel>=6", "jupytext>=1.16", "nbconvert>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coenergy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
